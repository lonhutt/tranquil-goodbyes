<script>
const tabs=[...document.querySelectorAll('.tab')],panes=[...document.querySelectorAll('.pane')],blurb=document.getElementById('blurb');
function show(i){
  tabs.forEach((t,k)=>t.setAttribute('aria-selected',k===i));
  panes.forEach((p,k)=>p.classList.toggle('on',k===i));
  blurb.textContent=panes[i].dataset.blurb;
  location.hash=i+1;
}
tabs.forEach((t,i)=>t.onclick=()=>show(i));
document.querySelectorAll('.view button').forEach(b=>b.onclick=()=>{
  document.body.classList.toggle('mobile',b.dataset.v==='mobile');
  document.querySelectorAll('.view button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
document.addEventListener('keydown',e=>{
  const cur=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');
  if(e.key==='ArrowRight')show((cur+1)%tabs.length);
  if(e.key==='ArrowLeft')show((cur+tabs.length-1)%tabs.length);
});
show(Math.min(Math.max((parseInt(location.hash.slice(1))||1)-1,0),tabs.length-1));
</script></body></html>
